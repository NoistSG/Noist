<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Form</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f0e1; /* Light brown background */
    color: #000; /* Black text for readability */
    padding: 20px;
  }

  h1, h2, h3 {
    color: #bfa14d; /* Gold-like color for headings */
  }

  /* Style labels and inputs for a cohesive look */
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
  }

  input[type="number"], input[type="text"] {
    padding: 5px 10px;
    border: 2px solid #bfa14d; /* Gold border */
    border-radius: 4px;
    font-size: 16px;
    margin-left: 10px;
  }

  /* Style for radio buttons and labels */
  input[type="radio"] {
    margin-right: 8px;
  }

  /* Style the delivery address section */
  #delivery_address {
    display: none;
    margin-top: 10px;
    padding: 10px;
    background-color: #fff8f0; /* Slightly lighter background for contrast */
    border: 2px solid #bfa14d; /* Gold border */
    border-radius: 8px;
  }

  /* Style total display */
  #grandTotal {
    font-size: 24px;
    font-weight: bold;
    color: #bfa14d; /* Gold color for total */
  }

  /* Style submit button */
  button {
    padding: 10px 20px;
    font-size: 18px;
    background-color: #bfa14d; /* Gold button */
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 20px;
  }

  button:hover {
    background-color: #a0843f; /* Slightly darker gold on hover */
  }

  /* Optional: style for product blocks */
  .product {
    margin-bottom: 15px;
  }
</style>
</head>
<body>

<h1>Order Form</h1>

<!-- Collection Method -->
<h2>Choose Collection Method:</h2>
<label><input type="radio" name="collection_method" value="self_pickup" checked /> Self Pick Up</label>
<label><input type="radio" name="collection_method" value="delivery" /> Delivery</label>

<!-- Delivery Address -->
<div id="delivery_address">
  <h3>Delivery Address</h3>
  <label>Street: <input type="text" name="street" /></label>
  <label>City: <input type="text" name="city" /></label>
  <label>Zip Code: <input type="text" name="zip" /></label>
</div>

<!-- Products -->
<h2>Products:</h2>

<div class="product">
  <label>Lasagna Beef Personal ($18): 
    <input type="number" name="lasagna_beef_personal" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Lasagna Beef Sharing ($30): 
    <input type="number" name="lasagna_beef_sharing" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Lasagna Beef Party ($90): 
    <input type="number" name="lasagna_beef_party" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Lasagna Chicken Personal ($16): 
    <input type="number" name="lasagna_chicken_personal" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Lasagna Chicken Sharing ($28): 
    <input type="number" name="lasagna_chicken_sharing" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Lasagna Chicken Party ($85): 
    <input type="number" name="lasagna_chicken_party" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Brownie 9 inch ($35): 
    <input type="number" name="brownie_9inch" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Brownie Nutella ($38): 
    <input type="number" name="brownie_nutella" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Personal Brownie ($6): 
    <input type="number" name="personal_brownie" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Personal Brownie Nutella ($7): 
    <input type="number" name="personal_brownie_nutella" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Brownie Bites ($25): 
    <input type="number" name="brownie_bites" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Banana 9 inch ($30): 
    <input type="number" name="banana_9inch" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Banana Chocolate ($33): 
    <input type="number" name="banana_chocolate" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Personal Banana ($5): 
    <input type="number" name="personal_banana" value="0" min="0" />
  </label>
</div>
<div class="product">
  <label>Personal Banana Chocolate ($6): 
    <input type="number" name="personal_banana_chocolate" value="0" min="0" />
  </label>
</div>

<!-- Total Display -->
<h2>Grand Total: <span id="grandTotal">$0.00</span></h2>

<!-- Submit Button -->
<button type="button" onclick="alert('Order submitted!')">Submit Order</button>

<script>
  // Show or hide delivery address based on selection
  const deliveryRadio = document.querySelector('input[value="delivery"]');
  const pickupRadio = document.querySelector('input[value="self_pickup"]');
  const addressDiv = document.getElementById('delivery_address');

  function toggleAddress() {
    if (deliveryRadio.checked) {
      addressDiv.style.display = 'block';
    } else {
      addressDiv.style.display = 'none';
    }
  }

  // Attach event listeners for the radio buttons
  deliveryRadio.addEventListener('change', toggleAddress);
  pickupRadio.addEventListener('change', toggleAddress);
  // Initialize address display
  toggleAddress();

  // Define prices for each product
  const prices = {
    lasagna_beef_personal: 18,
    lasagna_beef_sharing: 30,
    lasagna_beef_party: 90,
    lasagna_chicken_personal: 16,
    lasagna_chicken_sharing: 28,
    lasagna_chicken_party: 85,
    brownie_9inch: 35,
    brownie_nutella: 38,
    personal_brownie: 6,
    personal_brownie_nutella: 7,
    brownie_bites: 25,
    banana_9inch: 30,
    banana_chocolate: 33,
    personal_banana: 5,
    personal_banana_chocolate: 6
  };

  // Function to calculate total
  function calculateTotal() {
    let total = 0;

    // Sum product totals
    for (const [key, price] of Object.entries(prices)) {
      const qty = parseInt(document.querySelector(`input[name="${key}"]`).value) || 0;
      total += qty * price;
    }

    // Add delivery fee if "Delivery" is selected
    const deliverySelected = document.querySelector('input[name="collection_method"]:checked').value === 'delivery';
    if (deliverySelected) {
      total += 10; // delivery fee
    }

    // Update total display
    document.getElementById('grandTotal').textContent = `$${total.toFixed(2)}`;
  }

  // Attach event listeners to quantity inputs
  const quantityInputs = document.querySelectorAll('input[type=number]');
  quantityInputs.forEach(input => {
    input.addEventListener('input', calculateTotal);
  });

  // Attach event listeners to collection method radio buttons
  const collectionRadios = document.querySelectorAll('input[name="collection_method"]');
  collectionRadios.forEach(radio => {
    radio.addEventListener('change', calculateTotal);
  });

  // Calculate total on page load
  window.onload = calculateTotal;
</script>

</body>
</html>
